
name: Build and publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gutenberg-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/divcamillediv/gutenberg-library-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/divcamillediv/gutenberg-library-frontend:latest

  deploy:
    name: Deploy to AWS EC2
    needs: publish
    runs-on: [self-hosted, linux, gutenberg-deploy]
    timeout-minutes: 15

    steps:
      - name: Pull and deploy Docker images
        run: |
          set -e
          cd /opt/gutenberg

          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.aws.yml \
            pull

          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.aws.yml \
            up -d --no-build --remove-orphans

      - name: Verify backend health
        run: |
          for i in $(seq 1 30); do
            if docker exec gutenberg-backend-1 python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify frontend
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost/
